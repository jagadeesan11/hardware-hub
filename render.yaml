# Render blueprint for the API. Import this repo at https://render.com and Render
# reads this file. DATABASE_URL, JWT_SECRET, CORS_ORIGIN and the Razorpay keys
# are left unset on purpose — set them in the Render dashboard so nothing
# sensitive lands in git.
services:
  - type: web
    name: hardware-hub-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev overrides the NODE_ENV=production set below for this one
    # command. Without it, `npm ci` selectively drops devDependencies at
    # install time (including @types/node, which tsconfig.json requires via
    # `"types": ["node"]`) and the TypeScript build fails with
    # `TS2688: Cannot find type definition file for 'node'` before it ever
    # gets to your code. NODE_ENV=production is still what the running
    # server sees — this only affects how the build step installs.
    buildCommand: npm ci --include=dev && npm run build
    # `migrate deploy` (not `migrate dev`) applies committed migrations
    # non-interactively — safe to run on every boot, no-ops once caught up.
    # Render's free tier spins the service down after idle and rebuilds it
    # from scratch on the next request, so this can't be a one-time step.
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
